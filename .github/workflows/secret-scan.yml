name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    env:
      BETTERLEAKS_VERSION: 1.10.1
      # https://github.com/betterleaks/betterleaks/releases/download/v1.10.1/checksums.txt
      BETTERLEAKS_SHA256: c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 全履歴を検査する

      - name: Install betterleaks
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/betterleaks"
          tar -xzf "${archive}" -C "$RUNNER_TEMP/betterleaks"
          echo "$RUNNER_TEMP/betterleaks" >> "$GITHUB_PATH"

      - name: Scan git history
        run: betterleaks git . --redact --verbose --no-banner
